[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-road-trip-compatibility"
version = "0.1.0"
description = "Evidence-based ATS Road Trip map compatibility inspection and generation"
requires-python = ">=3.11"
dependencies = []
license = {text = "AGPL-3.0-only"}

[tool.setuptools]
license-files = ["LICENSE", "LICENSING.md", "THIRD_PARTY_NOTICES.md"]

[project.optional-dependencies]
background = ["Pillow==12.0.0", "numpy==2.3.4", "scipy==1.16.3", "pyshp==2.3.1", "pyproj==3.7.2"]

[project.scripts]
ats-road-trip = "ats_road_trip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"ats_road_trip.station_parking" = ["reviewed_catalog.json"]
