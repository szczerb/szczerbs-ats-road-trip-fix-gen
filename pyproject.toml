[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-road-trip-compatibility"
version = "0.1.0"
description = "Evidence-based ATS Road Trip map compatibility inspection and generation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ats-road-trip = "ats_road_trip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
